name: CI & Zero-Touch Cloud Run Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: dojo-zen-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: herrington-ai-site
  REGION: us-central1
  SERVICE_NAME: dojo-zen
  SITE_TARGET: dojo

jobs:
  test:
    name: Run Pytest Suite (57 Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run unit & MCP integration tests
        run: uv run pytest -v

  deploy:
    name: Deploy to Cloud Run
    needs: test  # tests must pass first
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Protected environment (DAN-406): deployment branches limited to main, Daniel as required
    # reviewer. Its name is part of the OIDC subject the GCP provider trusts.
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Keyless: GitHub OIDC -> Workload Identity Federation. No service-account JSON key.
      # Without the config this FAILS (DAN-478): a quiet green skip let merged PRs look deployed.
      - name: Check for Workload Identity config
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
        run: |
          if [ -z "$WIF_PROVIDER" ] || [ -z "$DEPLOY_SA" ]; then
            msg="NOT DEPLOYED: GCP_WIF_PROVIDER / GCP_DEPLOY_SA are not set on the production environment (DAN-406, DAN-478). This commit is merged but not live."
            echo "::error title=Deploy did not run::$msg"
            echo "### $msg" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy dojo-zen to Cloud Run
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --source . \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2 \
            --quiet

      # Cloud Scheduler jobs are managed by hand, not here (DAN-478): the deploy account has no
      # scheduler access and never sees CRON_SECRET. See HANDOFF.md for the job definitions.

      - name: Verify live production health
        run: |
          curl -fsSL https://dojo.herrington.ai/api/status | python3 -m json.tool
