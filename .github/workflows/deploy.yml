name: CI & Zero-Touch Cloud Run Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: dojo-zen-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: herrington-ai-site
  REGION: us-central1
  SERVICE_NAME: dojo-zen
  SITE_TARGET: dojo

jobs:
  test:
    name: Run Pytest Suite (57 Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run unit & MCP integration tests
        run: uv run pytest -v

  deploy:
    name: Deploy to Cloud Run & Cloud Scheduler
    needs: test  # tests must pass first
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Protected environment (DAN-406): deployment branches limited to main, Daniel as required
    # reviewer. Its name is part of the OIDC subject the GCP provider trusts.
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Keyless: GitHub OIDC -> Workload Identity Federation. No service-account JSON key.
      - name: Check for Workload Identity config
        id: check_creds
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
        run: |
          if [ -z "$WIF_PROVIDER" ] || [ -z "$DEPLOY_SA" ]; then
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "### Skipping deploy: GCP_WIF_PROVIDER / GCP_DEPLOY_SA environment variables are not set (see DAN-406)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up Cloud SDK
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy dojo-zen to Cloud Run
        if: steps.check_creds.outputs.has_creds == 'true'
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --source . \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2 \
            --quiet

      - name: Sync Cloud Scheduler Jobs (Weekday 7AM ET + Sunday 6PM ET)
        if: steps.check_creds.outputs.has_creds == 'true'
        env:
          # Must match CRON_SECRET on the dojo-zen service. Sent as a header, never in the URL.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET GitHub secret is not set; leaving Cloud Scheduler jobs unchanged."
            exit 0
          fi
          SERVICE_URL=$(gcloud run services describe "$SERVICE_NAME" --region "$REGION" --project "$PROJECT_ID" --format 'value(status.url)')
          echo "Cloud Run Service URL: $SERVICE_URL"

          # 1. Urgent Alerts (every 10 minutes)
          if gcloud scheduler jobs describe dojo-check-alerts --location "$REGION" --project "$PROJECT_ID" &>/dev/null; then
            gcloud scheduler jobs update http dojo-check-alerts \
              --location "$REGION" \
              --project "$PROJECT_ID" \
              --schedule "*/10 * * * *" \
              --time-zone "America/New_York" \
              --uri "$SERVICE_URL/api/cron/check-alerts" \
              --update-headers "Authorization=Bearer $CRON_SECRET" \
              --http-method POST \
              --quiet
          else
            gcloud scheduler jobs create http dojo-check-alerts \
              --location "$REGION" \
              --project "$PROJECT_ID" \
              --schedule "*/10 * * * *" \
              --time-zone "America/New_York" \
              --uri "$SERVICE_URL/api/cron/check-alerts" \
              --headers "Authorization=Bearer $CRON_SECRET" \
              --http-method POST \
              --quiet
          fi

          # 2. Weekday Morning Digest (Mon-Fri 7:00 AM ET)
          if gcloud scheduler jobs describe dojo-daily-digest --location "$REGION" --project "$PROJECT_ID" &>/dev/null; then
            gcloud scheduler jobs update http dojo-daily-digest \
              --location "$REGION" \
              --project "$PROJECT_ID" \
              --schedule "0 7 * * 1-5" \
              --time-zone "America/New_York" \
              --uri "$SERVICE_URL/api/cron/daily-digest" \
              --update-headers "Authorization=Bearer $CRON_SECRET" \
              --http-method POST \
              --quiet
          else
            gcloud scheduler jobs create http dojo-daily-digest \
              --location "$REGION" \
              --project "$PROJECT_ID" \
              --schedule "0 7 * * 1-5" \
              --time-zone "America/New_York" \
              --uri "$SERVICE_URL/api/cron/daily-digest" \
              --headers "Authorization=Bearer $CRON_SECRET" \
              --http-method POST \
              --quiet
          fi

          # 3. Sunday Evening Week-Ahead Digest (Sun 6:00 PM ET)
          if gcloud scheduler jobs describe dojo-sunday-digest --location "$REGION" --project "$PROJECT_ID" &>/dev/null; then
            gcloud scheduler jobs update http dojo-sunday-digest \
              --location "$REGION" \
              --project "$PROJECT_ID" \
              --schedule "0 18 * * 0" \
              --time-zone "America/New_York" \
              --uri "$SERVICE_URL/api/cron/daily-digest" \
              --update-headers "Authorization=Bearer $CRON_SECRET" \
              --http-method POST \
              --quiet
          else
            gcloud scheduler jobs create http dojo-sunday-digest \
              --location "$REGION" \
              --project "$PROJECT_ID" \
              --schedule "0 18 * * 0" \
              --time-zone "America/New_York" \
              --uri "$SERVICE_URL/api/cron/daily-digest" \
              --headers "Authorization=Bearer $CRON_SECRET" \
              --http-method POST \
              --quiet
          fi

      - name: Verify live production health
        if: steps.check_creds.outputs.has_creds == 'true'
        run: |
          curl -fsSL https://dojo.herrington.ai/api/status | python3 -m json.tool
